<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="rangeSubTitle">
  <title id="rangeSubTitle">Range Subscription Platform</title>
  <defs>
    <linearGradient id="sub-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057aab" />
      <stop offset="50%" stop-color="#04648C" />
      <stop offset="100%" stop-color="#02425d" />
    </linearGradient>
    <linearGradient id="sub-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd52c" />
      <stop offset="60%" stop-color="#FBCA07" />
      <stop offset="100%" stop-color="#e5b400" />
    </linearGradient>
    <filter id="sub-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Central Subscription Card in Range Blue -->
  <g filter="url(#sub-shadow)">
    <rect x="106" y="146" width="300" height="220" rx="36" fill="url(#sub-blue)" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
    <!-- Magnetic Stripe -->
    <rect x="106" y="195" width="300" height="42" fill="#022e40" />
    <!-- Chip / Contact Pad -->
    <rect x="146" y="270" width="56" height="46" rx="10" fill="#FBCA07" />
    <!-- Card Info lines -->
    <rect x="226" y="280" width="120" height="12" rx="6" fill="rgba(255,255,255,0.4)" />
    <rect x="226" y="302" width="80" height="10" rx="5" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Synchronous Repeating Circular Arrows in Range Yellow -->
  <g filter="url(#sub-shadow)">
    <!-- Top-Right Curve -->
    <path d="M 256 60 C 370 60, 460 150, 460 256 C 460 286, 452 314, 438 338" fill="none" stroke="url(#sub-yellow)" stroke-width="30" stroke-linecap="round" />
    <!-- Arrowhead 1 -->
    <polygon points="415,355 455,350 460,305" fill="url(#sub-yellow)" />

    <!-- Bottom-Left Curve -->
    <path d="M 256 452 C 142 452, 52 362, 52 256 C 52 226, 60 198, 74 174" fill="none" stroke="url(#sub-yellow)" stroke-width="30" stroke-linecap="round" />
    <!-- Arrowhead 2 -->
    <polygon points="97,157 57,162 52,207" fill="url(#sub-yellow)" />
  </g>
</svg>
