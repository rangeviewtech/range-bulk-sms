<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="rangeInvoicesTitle">
  <title id="rangeInvoicesTitle">Range Invoices Platform</title>
  <defs>
    <linearGradient id="invoices-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057aab" />
      <stop offset="50%" stop-color="#04648C" />
      <stop offset="100%" stop-color="#02425d" />
    </linearGradient>
    <linearGradient id="invoices-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd52c" />
      <stop offset="60%" stop-color="#FBCA07" />
      <stop offset="100%" stop-color="#e5b400" />
    </linearGradient>
    <filter id="invoices-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Document Card -->
  <g filter="url(#invoices-shadow)">
    <rect x="76" y="56" width="300" height="400" rx="36" fill="url(#invoices-bg)" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
    
    <!-- Invoice Header Lines -->
    <rect x="120" y="110" width="120" height="24" rx="12" fill="#FBCA07" />
    <rect x="120" y="150" width="180" height="14" rx="7" fill="rgba(255,255,255,0.4)" />
    
    <!-- Invoice Table Rows -->
    <rect x="120" y="200" width="210" height="14" rx="7" fill="rgba(255,255,255,0.25)" />
    <rect x="120" y="235" width="170" height="14" rx="7" fill="rgba(255,255,255,0.25)" />
    <rect x="120" y="270" width="195" height="14" rx="7" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Floating Range Yellow Badge: Paid / Seal -->
  <g filter="url(#invoices-shadow)">
    <circle cx="360" cy="360" r="92" fill="url(#invoices-yellow)" />
    <circle cx="360" cy="360" r="76" fill="none" stroke="#04648C" stroke-width="6" stroke-dasharray="10 6" />
    <!-- Receipt / Currency Mark -->
    <path d="M 335 360 L 352 378 L 390 338" fill="none" stroke="#04648C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
