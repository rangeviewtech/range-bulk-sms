<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="rangeUssdTitle">
  <title id="rangeUssdTitle">Range Bulk USSD Platform</title>
  <defs>
    <linearGradient id="ussd-phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057aab" />
      <stop offset="50%" stop-color="#04648C" />
      <stop offset="100%" stop-color="#02425d" />
    </linearGradient>
    <linearGradient id="ussd-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071d2e" />
      <stop offset="100%" stop-color="#030e18" />
    </linearGradient>
    <linearGradient id="ussd-yellow-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd52c" />
      <stop offset="60%" stop-color="#FBCA07" />
      <stop offset="100%" stop-color="#e5b400" />
    </linearGradient>
    <filter id="ussd-depth" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#04648C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- LOWER ELEMENT: Range Yellow (#FBCA07) Session Response Bubble with 3 circular dots -->
  <g filter="url(#ussd-depth)">
    <!-- Yellow Speech Bubble Body (matching Range SMS lower bubble curve) -->
    <path
      d="M 210 240
         C 210 215, 230 195, 265 195
         L 425 195
         C 465 195, 492 222, 492 262
         L 492 375
         C 492 415, 465 442, 425 442
         L 370 442
         L 410 488
         C 416 495, 410 502, 400 496
         L 325 442
         L 265 442
         C 225 442, 210 415, 210 375
         Z"
      fill="url(#ussd-yellow-bubble)"
    />
    <!-- 3 Signature Range Circular Cutouts in Deep Blue -->
    <circle cx="305" cy="328" r="22" fill="#04648C" />
    <circle cx="365" cy="328" r="22" fill="#04648C" />
    <circle cx="425" cy="328" r="22" fill="#04648C" />
  </g>

  <!-- UPPER ELEMENT: Range Deep Blue (#04648C) Modern GSM Interactive Session Handset -->
  <g filter="url(#ussd-depth)">
    <!-- Smartphone Outer Bezel -->
    <rect
      x="36"
      y="20"
      width="240"
      height="390"
      rx="46"
      ry="46"
      fill="url(#ussd-phone-body)"
      stroke="rgba(255,255,255,0.2)"
      stroke-width="2"
    />

    <!-- Device Screen Canvas -->
    <rect
      x="52"
      y="48"
      width="208"
      height="334"
      rx="34"
      ry="34"
      fill="url(#ussd-screen)"
      stroke="rgba(4,100,140,0.5)"
      stroke-width="1.5"
    />

    <!-- Speaker Bar -->
    <rect
      x="126"
      y="32"
      width="60"
      height="5"
      rx="2.5"
      fill="#FFFFFF"
      fill-opacity="0.4"
    />

    <!-- Front Camera Dot -->
    <circle cx="98" cy="34" r="3.5" fill="#022738" />
    <circle cx="98" cy="34" r="1.5" fill="#00c6ff" fill-opacity="0.6" />

    <!-- USSD Interactive Session Card (The active menu prompt) -->
    <rect
      x="64"
      y="76"
      width="184"
      height="235"
      rx="22"
      ry="22"
      fill="#0a2a40"
      stroke="#0e4b6c"
      stroke-width="1.5"
    />

    <!-- USSD Code Banner: *144# -->
    <rect
      x="78"
      y="92"
      width="156"
      height="42"
      rx="12"
      ry="12"
      fill="url(#ussd-yellow-bubble)"
    />
    <text
      x="156"
      y="120"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="22"
      font-weight="900"
      fill="#04648C"
      text-anchor="middle"
      letter-spacing="2"
    >*144#</text>

    <!-- USSD Session Menu Items -->
    <!-- 1. Balance -->
    <g transform="translate(80, 150)">
      <circle cx="10" cy="7" r="7" fill="#FBCA07" />
      <text x="10" y="11" font-size="10" font-weight="900" fill="#04648C" text-anchor="middle">1</text>
      <rect x="26" y="2" width="112" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9" />
    </g>

    <!-- 2. Bundles -->
    <g transform="translate(80, 178)">
      <circle cx="10" cy="7" r="7" fill="#FBCA07" />
      <text x="10" y="11" font-size="10" font-weight="900" fill="#04648C" text-anchor="middle">2</text>
      <rect x="26" y="2" width="96" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75" />
    </g>

    <!-- 3. Banking -->
    <g transform="translate(80, 206)">
      <circle cx="10" cy="7" r="7" fill="#FBCA07" />
      <text x="10" y="11" font-size="10" font-weight="900" fill="#04648C" text-anchor="middle">3</text>
      <rect x="26" y="2" width="78" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6" />
    </g>

    <!-- Interactive Reply Action Button -->
    <rect
      x="80"
      y="242"
      width="152"
      height="28"
      rx="9"
      fill="#04648C"
      stroke="#38bdf8"
      stroke-width="1.5"
    />
    <rect x="98" y="253" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M 210 256 L 218 256 M 215 252 L 219 256 L 215 260" stroke="#FBCA07" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Home Indicator Pill -->
    <rect
      x="126"
      y="398"
      width="60"
      height="5"
      rx="2.5"
      fill="#FFFFFF"
      fill-opacity="0.4"
    />
  </g>
</svg>
