<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 75" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="grad-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <style>
      .font-range { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 46px; font-weight: 900; letter-spacing: -1.5px; }
      .font-sms { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 46px; font-weight: 300; letter-spacing: -1px; }
    </style>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Main Bubble Base -->
    <path d="M 20 10 L 45 10 C 56.05 10 65 18.95 65 30 L 65 40 C 65 51.05 56.05 60 45 60 L 32 60 L 12 72 L 18 57 C 9.77 53.5 4 45.4 4 36 C 4 21.64 11.16 10 20 10 Z" fill="url(#grad-main)"/>
    
    <!-- Inner Glass Overlay -->
    <path d="M 20 10 L 45 10 C 56.05 10 65 18.95 65 30 C 65 20 56 12 45 12 L 20 12 C 12 12 5 22 4 36 C 4 21.64 11.16 10 20 10 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 4 36 C 4 45.4 9.77 53.5 18 57 L 12 72 L 32 60 L 45 60 C 56.05 60 65 51.05 65 40 C 65 48 56 58 45 58 L 32 58 L 16 68 L 20 56 C 12 53 6 45 4 36 Z" fill="url(#grad-shadow)"/>

    <!-- Minimalist Paper Plane (Send/Fast Icon) -->
    <path d="M 20 36 L 50 20 L 34 50 L 30 40 L 43 26 L 25 34 Z" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="85" y="52">
    <tspan class="font-range" fill="#ffffff">Range</tspan>
    <tspan class="font-sms" fill="#94a3b8" dx="4">Bulk SMS</tspan>
  </text>
</svg>